name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # MorpheApp's registry requires authentication, so no Gradle step may go without it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: crimera
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify artifact layout
        run: |
          set -euo pipefail
          ./gradlew jar --no-daemon
          JAR=$(ls build/libs/piko-patches-library-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -q 'app/crimera/patches/common/ResolverCardinalityKt.class'
          unzip -l "$JAR" | grep -q 'app/crimera/tools/lint/ResolverLinter.class'
          unzip -l "$JAR" | grep -q 'META-INF/NOTICE'
          echo "$JAR: classes and notices verified"

          ./gradlew :extension:assembleRelease --no-daemon
          AAR=extension/build/outputs/aar/extension-release.aar
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/extension-classes.jar"
          unzip -l "$RUNNER_TEMP/extension-classes.jar" | grep -q 'app/morphe/extension/crimera/logging/PikoLogger.class'
          echo "$AAR: extension classes verified"

          ./gradlew :extension-settings:assembleRelease --no-daemon
          SETTINGS_AAR=extension-settings/build/outputs/aar/extension-settings-release.aar
          unzip -p "$SETTINGS_AAR" classes.jar > "$RUNNER_TEMP/extension-settings-classes.jar"
          unzip -l "$RUNNER_TEMP/extension-settings-classes.jar" | grep -q 'app/morphe/extension/crimera/settings/SettingsRegistry.class'
          unzip -l "$RUNNER_TEMP/extension-settings-classes.jar" | grep -q 'app/morphe/extension/crimera/theme/PikoTheme.class'
          echo "$SETTINGS_AAR: settings classes verified"

          ./gradlew :patches-settings:jar --no-daemon
          SETTINGS_JAR=$(ls patches-settings/build/libs/patches-settings-*.jar | grep -v sources | head -1)
          unzip -l "$SETTINGS_JAR" | grep -q 'app/crimera/patches/settings/SettingsContributionKt.class'
          echo "$SETTINGS_JAR: patch-side settings classes verified"

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Publish
        run: |
          if [[ -n "${{ steps.version.outputs.value }}" ]]; then
            ./gradlew publish --no-daemon -PlibraryVersion=${{ steps.version.outputs.value }}
          else
            ./gradlew publish --no-daemon
          fi
