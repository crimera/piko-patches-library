org.gradle.caching = true
org.gradle.jvmargs = -Xms512M -Xmx2048M
org.gradle.parallel = true
kotlin.code.style = official
# Stamped by the Release workflow (gradle-semantic-release-plugin); every module inherits it.
version = 0.6.1
# The :extension module is Java-only; AGP 9 built-in Kotlin would add kotlin-stdlib to its POM
# and so to every consumer extension dex.
android.builtInKotlin = false
