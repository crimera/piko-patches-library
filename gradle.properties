org.gradle.caching = true
org.gradle.jvmargs = -Xms512M -Xmx2048M
org.gradle.parallel = true
kotlin.code.style = official

# The tag workflow overrides this with -PlibraryVersion=<tag>.
libraryVersion = 0.2.0

# The :extension module is Java-only; AGP 9 built-in Kotlin would add kotlin-stdlib to its POM
# and so to every consumer extension dex.
android.builtInKotlin = false
